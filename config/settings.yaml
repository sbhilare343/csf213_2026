# All paths are relative to the project root (the parent of config/).
paths:
  rubric_xlsx: Grader/testcases.xlsx
  rubric_pdf: Grader/grader-testcases.pdf
  attendance_xlsx: Grader/midterm-lab-attendance.xlsx
  submissions_dir: submissions
  output_dir: output

rubric:
  sheet_name: TestCases
  header_row: 1
  expected_total_marks: 60
  expected_testcase_count: 26

attendance:
  sheet_name: LabMidterm Attendance
  header_row: 1
  columns:
    student_id: ID number
    name: Name
    email: Email address
    groups: Groups
    zone: Zone
    seat: Seat
    absent: Absent
    makeup: Makeup
    valid_submission: Valid submission on Quanta

submissions:
  layout: directory
  # Prefer folders named by campus ID, e.g. submissions/2025A7CS0182G/.
  student_id_regex: '(?P<student_id>20[0-9]{2}[A-Za-z0-9]{5,}G)'
  cpp_extensions: [.cpp, .cc, .cxx, .c++]
  header_extensions: [.h, .hh, .hpp, .hxx, .H]
  ignored_directories: [.git, build, CMakeFiles, cmake-build-debug, cmake-build-release, .idea, .vscode, __MACOSX, node_modules]
  max_files: 300
  max_total_bytes: 52428800       # 50 MiB per student
  max_single_file_bytes: 10485760 # 10 MiB per source/header

harness:
  source_mode: auto                # auto, headers, or monolithic
  adapter_header: config/ride_api_adapter.hpp
  monolithic_adapter_header: config/ride_api_adapter_monolithic.hpp
  headers:
    user: User.h
    driver: Driver.h
    ride: Ride.h
    ride_service: RideService.h

compiler:
  executable: g++
  standard: c++17
  flags: [-O2, -pipe, -Wall, -Wextra]
  compile_timeout_seconds: 60
  compile_cpu_seconds: 45
  memory_mb: 2048
  max_binary_bytes: 52428800

execution:
  sandbox: required               # required (bubblewrap) or unsafe (trusted code only)
  worker_reserve_cores: 2
  max_workers: null               # null -> logical cores minus reserved cores
  cpu_seconds: 3
  wall_timeout_seconds: 4
  memory_mb: 256
  tmpfs_mb: 128                 # cap per-sandbox /tmp usage
  max_output_bytes: 1048576
  max_processes: 64
  max_open_files: 64

policies:
  compile_failure: zero            # matches the reference Java grader's documented behavior
  missing_submission: hold         # don't invent a grade for a missing submission
  no_cpp_source: hold              # Java bundles are not C++ submissions
  duplicate_submission: hold
  ambiguous_identity: hold
  infrastructure_failure: hold

reports:
  xlsx: grades.xlsx
  csv: grades.csv
  json: results.json
  reconciliation_xlsx: student_reconciliation.xlsx
  run_summary: run_summary.json

archive_import:
  max_outer_entries: 30000
  max_outer_uncompressed_bytes: 1073741824  # 1 GiB
  max_entries_per_nested_zip: 10000
  max_uncompressed_bytes_per_student: 536870912  # 512 MiB cumulative extracted ZIP data
  max_materialized_bytes_per_student: 536870912  # 512 MiB copied/cloned project
  max_archive_file_bytes: 104857600  # 100 MiB per nested ZIP/Git bundle
  max_nested_archive_depth: 2
  max_archives_per_student: 20
  git_clone_timeout_seconds: 120
  git_memory_mb: 1024
